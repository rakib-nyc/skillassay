name: CI

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly: the ecosystem this measures moves fast, and stale accuracy
    # figures are worse than none.
    - cron: '0 6 * * 1'

jobs:
  verify:
    # Windows is in the matrix because the code has never been *run* there:
    # path handling, the MCP `shell: true` shim and CRLF are all audited by
    # inspection and pinned by test/portability.test.ts, which is not the same
    # as having executed them. Node 20 is the declared engines floor.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '22', '24']
        exclude:
          # Keep the matrix cheap: the middle version on one OS is enough.
          - { os: windows-latest, node: '22' }
          - { os: macos-latest, node: '22' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - run: npm ci

      # The integrity rules — fails on randomness, demo branches, unlabelled token
      # estimates, TODO markers, simulation language, or silent catch blocks.
      - name: Anti-simulation check
        run: npm run lint:honesty

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

      # the self-audit requirement — exits non-zero if the tool cannot produce a clean
      # report on its own configuration. Generated files are compared on Linux
      # only: line-ending normalisation makes `git diff` noisy on Windows.
      - name: Self-audit
        if: matrix.os == 'ubuntu-latest' && matrix.node == '20'
        run: npm run self-audit

      - name: Docs are current
        if: matrix.os == 'ubuntu-latest' && matrix.node == '20'
        run: |
          npm run docs:rules
          git diff --exit-code RULES.md SELF_AUDIT.md

      - name: Calibration is current
        if: matrix.os == 'ubuntu-latest' && matrix.node == '20'
        run: |
          npm run calibrate
          git diff --exit-code calibration/RESULTS.md

  # Corpus validation is a separate job: it clones ~1,000 skills from eleven
  # third-party repositories, which is too slow and too network-dependent to
  # gate every pull request on. It runs on a schedule and on demand, and the
  # published accuracy figures come from it.
  corpus:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - run: npm ci
      - name: Fetch corpus at pinned commits
        run: npm run corpus:fetch
      - name: Parse rate and findings distribution
        run: npm run corpus:validate -- corpus
      - name: Recall
        run: npm run measure:recall -- corpus
      - name: Registry audit is current
        run: |
          npx tsx src/cli.ts corpus --registry --markdown > /tmp/audit.md
          diff <(tail -n +4 REGISTRY_AUDIT.md) <(tail -n +2 /tmp/audit.md)
